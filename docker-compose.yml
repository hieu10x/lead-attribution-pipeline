# Local Postgres for development and integration tests (bound to localhost only)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lap
      POSTGRES_PASSWORD: lap
      POSTGRES_DB: lap
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lap -d lap"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
